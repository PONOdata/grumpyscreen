name: automerge
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable:
    if: ${{ github.event.pull_request.draft == false }}
    # GitHub-hosted, because this repo is PUBLIC. Hosted minutes cost nothing
    # on a public repo, and the org's self-hosted runner group does not serve
    # public repos, so the move to the pono-runner pool in #61 left this job
    # queued on every PR from 2026-09-12: #64 and #65 sat green and unmerged
    # until merged by hand. pono-kalico, also public, runs it on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # A merge attributed to GITHUB_TOKEN creates no workflow runs, so an automerged
      # commit lands on the default branch with none of its `on: push` legs firing.
      # An installation token from a GitHub App is a different identity, so the push
      # path stays normal and the existing triggers run unchanged.
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ vars.PONO_AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.PONO_AUTOMERGE_APP_PRIVATE_KEY }}

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // GitHub refuses to arm auto-merge while a PR's mergeability is still settling,
            // which is the ordinary state in the seconds after `opened`, the event this
            // workflow fires on. The old code caught that, logged it with core.info and
            // exited 0, so a green PR sat unmerged with a green enabler above it.
            //
            // The window has to outlast the gate checks, because the PR stays "unstable"
            // until they settle. Measured on this repo 2026-08-08, they take roughly two
            // minutes, and a 95 second window gave up while they were still running. This
            // sums to about four and a half minutes and exits the moment arming succeeds.
            const BACKOFF_MS = [5000, 10000, 20000, 30000, 45000, 60000, 60000, 60000];

            // A wall-clock bound on the whole loop, so the last-resort merge below always
            // runs inside the job's 8 minute cap. Measured on PONOdata/Appy #57 on
            // 2026-10-03: one call hung for 307 seconds before failing, the cap cancelled
            // the job in its backoff, and a merge that would have succeeded never ran.
            const DEADLINE_MS = 6 * 60 * 1000;
            // The same hang bounded per call, so no single request outlives this.
            const REQUEST_TIMEOUT_MS = 30000;

            const ENABLE_AUTO_MERGE = `mutation($id: ID!) {
              enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                clientMutationId
              }
            }`;

            async function enableAutoMerge({
              github, context, core, backoff = BACKOFF_MS, sleep, now, deadlineMs = DEADLINE_MS,
            }) {
              const pr = context.payload.pull_request;
              const wait = sleep || ((ms) => new Promise((r) => setTimeout(r, ms)));
              const clock = now || (() => Date.now());
              const started = clock();
              const request = () => ({ signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) });
              const squash = () =>
                github.rest.pulls.merge({
                  ...context.repo,
                  pull_number: pr.number,
                  merge_method: "squash",
                  request: request(),
                });
              let last = "";

              for (let attempt = 0; attempt <= backoff.length; attempt++) {
                try {
                  await github.graphql(ENABLE_AUTO_MERGE, { id: pr.node_id, request: request() });
                  core.info("auto-merge enabled");
                  return "armed";
                } catch (e) {
                  last = e.message;
                  core.info(`attempt ${attempt + 1}: ${last}`);

                  // "clean status" means every required check has already passed, so there
                  // is nothing for a queue to wait on and GitHub refuses to arm one. The PR
                  // merges now or it never does. Merging here grants nothing extra: clean
                  // is GitHub's own verdict that the required contexts are green, which is
                  // the same condition auto-merge would have waited for.
                  //
                  // "unstable status" gets the same attempt. It means the required checks
                  // can be green while some other check is not, and this job is one such
                  // check for as long as it runs, so a PR whose gate finished first never
                  // reaches clean while the job is alive. Measured on PONOdata/Appy #57:
                  // seven required contexts green in 13 seconds, then eight minutes of
                  // refusals. While the gate is still running the ruleset refuses this
                  // merge, so it lands nothing auto-merge would not have.
                  if (/clean status|unstable status/i.test(last)) {
                    // This merge is NOT allowed to throw. Unguarded, a refusal here
                    // escapes the loop and the function, reaches the top-level call with
                    // no handler, and github-script turns an unhandled rejection into a
                    // failed step: the red check that poisons arming, which is what the
                    // warning path further down exists to avoid. A refusal means not yet,
                    // so log it and let the loop keep trying.
                    try {
                      await squash();
                      core.info("required checks already green; merged directly");
                      return "merged";
                    } catch (mergeError) {
                      core.info(`direct merge refused: ${mergeError.message}`);
                    }
                  }

                  if (attempt < backoff.length) {
                    if (clock() - started + backoff[attempt] > deadlineMs) {
                      core.info(`deadline: ${Math.round((clock() - started) / 1000)}s spent, stopping the retries`);
                      break;
                    }
                    await wait(backoff[attempt]);
                  }
                }
              }

              // Last resort: ask to merge outright. The branch ruleset is the gate, so this
              // succeeds only if the required contexts are green and is refused otherwise,
              // which means it cannot merge anything auto-merge would not have.
              try {
                await squash();
                core.info("never armed, but the required checks were green; merged directly");
                return "merged";
              } catch (e) {
                // Deliberately a warning and NOT core.setFailed. A red check on this job
                // puts the PR in UNSTABLE, and GitHub refuses to arm auto-merge on an
                // unstable PR, so failing loudly here poisons the very thing it reports on
                // and no later attempt can recover it. Measured on #163 2026-08-08: the job
                // went red, the PR sat UNSTABLE with all seven required contexts green, and
                // it had to be merged by hand. A warning is visible in the checks UI and in
                // the job annotations, and it leaves the PR armable.
                core.warning(
                  `auto-merge never armed and the PR is not mergeable yet, so it will NOT merge itself. ` +
                    `Last arm refusal: ${last}. Merge refusal: ${e.message}`
                );
                return "unmerged";
              }
            }

            await enableAutoMerge({ github, context, core });