name: reusable-ci

# The shared gate. Target repos call this from a 3-line caller workflow; see
# templates/caller-ci.yml. Bump the tag on the metarepo and every caller updates
# at once. Every job always runs and reports, so a repo can mark any subset
# of checks required without deadlocking the merge queue on a skipped check.
#
# A gate with no command does NOT pass. This copy is vendored because this
# repo is public and gatekeeper is private, so the v0.4.0 tag that carries
# this change fleet-wide cannot reach it. Keep the two in step by hand.
#
# Called from a job named "gate", the check contexts are "gate / lint",
# "gate / test", and so on. The rulesets in this metarepo use those names.
#
# semgrep bootstraps itself when missing (hosted runners). dependency-review
# defaults off: the API behind it needs GHAS on private repos; public repos
# turn it on in the caller.
#
# On pull_request and merge_group events semgrep runs against the PR base as
# a baseline: only findings introduced by the change block. Latent debt in a
# repo does not ambush unrelated PRs; burn it down deliberately with a
# workflow_dispatch run, which scans the full tree.
on:
  workflow_call:
    inputs:
      runner_labels:
        type: string
        default: '["ubuntu-latest"]'
      lint_cmd:
        type: string
        default: ''
      typecheck_cmd:
        type: string
        default: ''
      test_cmd:
        type: string
        default: ''
      build_cmd:
        type: string
        default: ''
      # Comma-separated gate names (lint, typecheck, test, build)
      # this repo deliberately has no command for. Any gate left
      # unset and not named here fails.
      unconfigured_ok:
        type: string
        default: ''
      # Passed straight to actions/checkout, so the values are its own: false,
      # true, recursive. Default false leaves the other gates untouched. Only
      # the four command jobs honour it; semgrep and tell_check judge this
      # repo's own code and text, and third-party submodule trees in their
      # scope would bury real findings under upstream noise. Mirrors the input
      # added to gatekeeper's reusable in its Unreleased entry; this copy is
      # vendored because a public repo cannot call a private reusable, so no
      # tag reaches it and the edit is by hand.
      checkout_submodules:
        type: string
        default: 'false'
      run_semgrep:
        type: boolean
        default: true
      semgrep_config:
        type: string
        default: 'p/default'
      # Defaulted to true to match gatekeeper. It was false here, and since no
      # caller set it, the required gate/tell_check context printed
      # "tell_check disabled, passing" and reported success having run nothing.
      run_tell_check:
        type: boolean
        default: true
      # Optional. Left empty the step runs the built-in scan below, which is
      # what a public repo needs, since the in-house ai-tells action is private
      # and unreachable from here.
      tell_check_cmd:
        type: string
        default: ''
      run_dependency_review:
        type: boolean
        default: false
      dependency_fail_on_severity:
        type: string
        default: 'low'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}
      - name: lint
        env:
          CMD: ${{ inputs.lint_cmd }}
          OK: ${{ inputs.unconfigured_ok }}
        run: |
          set -euo pipefail
          if [ -n "$CMD" ]; then eval "$CMD"; exit 0; fi
          case ",$(printf '%s' "$OK" | tr -d '[:space:]')," in
            *,lint,*) echo "lint: no command, declared not applicable in unconfigured_ok"; exit 0 ;;
          esac
          echo "::error::lint has no command configured and is not named in unconfigured_ok. Set lint_cmd, or name lint in unconfigured_ok to declare it not applicable. A gate does not pass without running something."
          exit 1

  typecheck:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}
      - name: typecheck
        env:
          CMD: ${{ inputs.typecheck_cmd }}
          OK: ${{ inputs.unconfigured_ok }}
        run: |
          set -euo pipefail
          if [ -n "$CMD" ]; then eval "$CMD"; exit 0; fi
          case ",$(printf '%s' "$OK" | tr -d '[:space:]')," in
            *,typecheck,*) echo "typecheck: no command, declared not applicable in unconfigured_ok"; exit 0 ;;
          esac
          echo "::error::typecheck has no command configured and is not named in unconfigured_ok. Set typecheck_cmd, or name typecheck in unconfigured_ok to declare it not applicable. A gate does not pass without running something."
          exit 1

  test:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}
      - name: clean submodule build residue
        # Self-hosted runners keep the workspace between jobs, and checkout
        # cleans the superproject only. Objects a previous job built in a
        # submodule for another target make ld fail with "file in wrong format".
        run: git submodule foreach --recursive git clean -ffdx
      - name: test
        env:
          CMD: ${{ inputs.test_cmd }}
          OK: ${{ inputs.unconfigured_ok }}
        run: |
          set -euo pipefail
          if [ -n "$CMD" ]; then eval "$CMD"; exit 0; fi
          case ",$(printf '%s' "$OK" | tr -d '[:space:]')," in
            *,test,*) echo "test: no command, declared not applicable in unconfigured_ok"; exit 0 ;;
          esac
          echo "::error::test has no command configured and is not named in unconfigured_ok. Set test_cmd, or name test in unconfigured_ok to declare it not applicable. A gate does not pass without running something."
          exit 1

  build:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules }}
      - name: clean submodule build residue
        # Self-hosted runners keep the workspace between jobs, and checkout
        # cleans the superproject only. Objects a previous job built in a
        # submodule for another target make ld fail with "file in wrong format".
        run: git submodule foreach --recursive git clean -ffdx
      - name: build
        env:
          CMD: ${{ inputs.build_cmd }}
          OK: ${{ inputs.unconfigured_ok }}
        run: |
          set -euo pipefail
          if [ -n "$CMD" ]; then eval "$CMD"; exit 0; fi
          case ",$(printf '%s' "$OK" | tr -d '[:space:]')," in
            *,build,*) echo "build: no command, declared not applicable in unconfigured_ok"; exit 0 ;;
          esac
          echo "::error::build has no command configured and is not named in unconfigured_ok. Set build_cmd, or name build in unconfigured_ok to declare it not applicable. A gate does not pass without running something."
          exit 1

  semgrep:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # Full history so the baseline sha is ALWAYS local without persisted
          # credentials. Depth 2 was enough for a pull request but missed
          # merge_group base shas on the second and later queue entries, and
          # the in-action fetch cannot authenticate, so the scan silently
          # degraded to a full-tree run: the latent-debt ambush the baseline
          # exists to prevent. gatekeeper v0.4.0 carries the same fix.
          fetch-depth: 0
      - name: semgrep
        env:
          RUN: ${{ inputs.run_semgrep }}
          CONFIG: ${{ inputs.semgrep_config }}
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$RUN" != "true" ]; then echo "semgrep disabled, passing"; exit 0; fi
          if ! command -v semgrep >/dev/null 2>&1; then
            python3 -m pip install --user --quiet semgrep 2>/dev/null \
              || python3 -m pip install --user --quiet --break-system-packages semgrep
            export PATH="$HOME/.local/bin:$PATH"
          fi
          if [ -n "$BASELINE" ]; then
            git fetch --quiet --depth=1 origin "$BASELINE" || true
            if git cat-file -e "$BASELINE" 2>/dev/null; then
              semgrep scan --error --config "$CONFIG" --quiet --baseline-commit "$BASELINE" .
            else
              echo "baseline commit unavailable, full scan"
              semgrep scan --error --config "$CONFIG" --quiet .
            fi
          else
            semgrep scan --error --config "$CONFIG" --quiet .
          fi

  tell_check:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # Full history, for the same reason as the semgrep job above: without
          # it the base sha is not local, the scan falls back to the whole tree,
          # and every pull request is judged against this fork's inherited text
          # rather than against what the change added. That is how the first
          # attempt at this reddened on an audit document from June.
          fetch-depth: 0
      - name: tell_check
        env:
          RUN: ${{ inputs.run_tell_check }}
          CMD: ${{ inputs.tell_check_cmd }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$RUN" != "true" ]; then echo "tell_check disabled, passing"; exit 0; fi
          # ${CMD:-} rather than $CMD: set -u is on, and an unset variable here
          # would abort the step before the scan with a shell error, which is a
          # failure mode that looks nothing like what it is.
          if [ -n "${CMD:-}" ]; then eval "$CMD"; exit 0; fi
          # No command: run the built-in scan, the same one the org profile
          # repo carries. The in-house ai-tells linter is a private action and
          # unreachable from a public repo, so this covers the mechanical half
          # of the house style: em dash, en dash and unicode arrows. Judgement
          # calls stay with review.
          #
          # On a pull request or a merge group it reads ADDED lines only, so
          # the dashes this fork inherited from upstream do not redden an
          # unrelated change; a dispatch with no base scans the whole tree.
          #
          # The pattern is literal UTF-8 bytes built with printf rather than a
          # -P hex class, because grep -P '[\x{2014}]' needs a UTF-8 locale and
          # exits 2 under LC_ALL=C, which a swallowed status would read as a
          # clean tree. An exit above 1 fails the job.
          pat="$(printf '\xe2\x80\x94\|\xe2\x80\x93\|\xe2\x86\x92\|\xe2\x86\x90\|\xe2\x87\x92')"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no usable base ref; scanning the whole tree"
            set +e
            target="$(git grep -n -e "$pat" -- .)"
            rc=$?
            set -e
          else
            set +e
            target="$(git diff --unified=0 "$BASE" HEAD -- . \
              | grep '^+' | grep -v '^+++' \
              | grep -n "$pat")"
            rc=$?
            set -e
          fi
          if [ "$rc" -gt 1 ]; then
            echo "::error::tell_check could not run its scan (exit $rc); refusing to report clean."
            exit 1
          fi
          if [ -n "$target" ]; then
            echo "$target"
            echo "::error::em dash, en dash or unicode arrow found. House style uses commas, periods and hyphens."
            exit 1
          fi
          echo "tell_check: clean"

  dependency-review:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: dependency-review
        if: ${{ inputs.run_dependency_review && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          fail-on-severity: ${{ inputs.dependency_fail_on_severity }}
          base-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      - name: dependency-review-disabled
        if: ${{ !inputs.run_dependency_review || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
        run: echo "dependency-review not applicable on this event or disabled, passing"
