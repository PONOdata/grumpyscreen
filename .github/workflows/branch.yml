name: branch build

on:
  push:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: mipsel-buildroot-linux-musl-
            small: false
            asset: guppyscreen
            calibrate: false

          - arch: mipsel-buildroot-linux-musl-
            small: true
            asset: guppyscreen-smallscreen
            calibrate: true

          - arch: armv8-rpi3-linux-gnueabihf-
            small: false
            calibrate: true
            asset: guppyscreen-rpi

    runs-on: ubuntu-22.04
    container:
      image: pellcorp/guppydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: set guppyscreen version
      run: |
        echo "GUPPYSCREEN_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make guppyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh ${{ matrix.asset }} ${{ github.sha }} ${{ github.ref_name }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}-debug
        path: ./${{ matrix.asset }}-debug.tar.gz
        # Debug symbols expire fast; the stripped build above keeps the repo
        # default. Measured 2026-09-12 across every repo in the org: 0.706 GB of
        # live Actions artifacts against a 500 MB allowance, and these three
        # -debug assets were 439.6 MB of it, 62% of the org total, versus 61.7 MB
        # for the three shipped ones. Symbols are seven times the size of the
        # thing they describe.
        #
        # They are also the shortest-lived thing here by USE. Debug symbols are
        # read while diagnosing one specific build, usually within days of it
        # breaking; eight branch builds' worth held for the default retention is
        # storage nobody is going to open.
        #
        # This does not touch the release assets, which is deliberate: those are
        # what someone flashes.
        retention-days: 7

    # Branch release only fires on push events (branch merge to pono / direct
    # push to a topic branch). Pull-request triggers skip this step: PR CI is
    # for build verification, not release publishing. The release-finalize API
    # call rejects updates when the tag already exists, so PR-time runs of
    # this step were racing the release creation and aborting all 3 builds.
    # Banked as a workflow flake 2026-05-22.
    - name: branch release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ matrix.asset }}.tar.gz
          ${{ matrix.asset }}-debug.tar.gz
        fail_on_unmatched_files: true
