name: branch build

on:
  push:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: mipsel-buildroot-linux-musl-
            small: false
            asset: guppyscreen
            calibrate: false

          - arch: mipsel-buildroot-linux-musl-
            small: true
            asset: guppyscreen-smallscreen
            calibrate: true

          - arch: armv8-rpi3-linux-gnueabihf-
            small: false
            calibrate: true
            asset: guppyscreen-rpi

    runs-on: ubuntu-22.04
    container:
      image: pellcorp/guppydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: set guppyscreen version
      run: |
        echo "GUPPYSCREEN_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make guppyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh ${{ matrix.asset }} ${{ github.sha }} ${{ github.ref_name }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}-debug
        path: ./${{ matrix.asset }}-debug.tar.gz
        # THREE days, and the first attempt at this line said 7, which was a
        # no-op: this repo's default retention is ALREADY 7 days. Measured off a
        # run from before the change, where all six artifacts expired exactly 7
        # days after creation without any retention-days set. Writing the
        # default back as though it were a saving is the kind of change that
        # looks like work and moves nothing.
        #
        # What the earlier note got wrong along with it: these three -debug
        # assets are 439.6 MB against 61.7 MB for the shipped ones, and that is
        # 62% of the org's live artifact bytes, but it is ONE DAY of builds
        # under a short retention rather than a pile accumulating. Symbols are
        # seven times the size of the thing they describe, and the fix is a
        # shorter window, not a window that already existed.
        #
        # Three days is chosen against USE rather than against the number.
        # Symbols get read while diagnosing one specific build, usually within a
        # day or two of it breaking. Past that nobody opens them.
        #
        # The release assets are untouched, which is deliberate: those are what
        # someone flashes, and they are small.
        retention-days: 3

    # Branch release only fires on push events (branch merge to pono / direct
    # push to a topic branch). Pull-request triggers skip this step: PR CI is
    # for build verification, not release publishing. The release-finalize API
    # call rejects updates when the tag already exists, so PR-time runs of
    # this step were racing the release creation and aborting all 3 builds.
    # Banked as a workflow flake 2026-05-22.
    - name: branch release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ matrix.asset }}.tar.gz
          ${{ matrix.asset }}-debug.tar.gz
        fail_on_unmatched_files: true
