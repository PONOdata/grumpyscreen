name: branch build

on:
  push:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: mipsel-buildroot-linux-musl-
            small: false
            asset: guppyscreen
            calibrate: false

          - arch: mipsel-buildroot-linux-musl-
            small: true
            asset: guppyscreen-smallscreen
            calibrate: true

          - arch: armv8-rpi3-linux-gnueabihf-
            small: false
            calibrate: true
            asset: guppyscreen-rpi

    runs-on: ubuntu-22.04
    container:
      image: pellcorp/guppydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: set guppyscreen version
      run: |
        echo "GUPPYSCREEN_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - if: matrix.small
      name: export screen size
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - if: matrix.calibrate
      name: export touch calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make guppyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh ${{ matrix.asset }} ${{ github.sha }} ${{ github.ref_name }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset }}-debug
        path: ./${{ matrix.asset }}-debug.tar.gz
        # ONE day, and the two wrong answers before it are the reason to write
        # the arithmetic down rather than the verdict.
        #
        # First attempt said 7, which was a NO-OP: this repo's default retention
        # is already 7 days, measured off a run from before the change where all
        # six artifacts expired exactly 7 days after creation with nothing set.
        # Writing a default back as though it were a saving looks like work and
        # moves nothing.
        #
        # Second attempt said 3, reasoning that 439.6 MB was "one day of builds"
        # so the window was the whole lever. The rate was never measured. It is
        # about TEN builds a day: 30 live -debug artifacts at 549.5 MB, every
        # one of them created on a single date.
        #
        # Live bytes are builds-per-day times retention times size, so the rate
        # decides what the window buys. At 7 days this repo tends toward roughly
        # 1.3 GB of symbols on its own, at 3 days about 550 MB, at 1 day about
        # 180 MB. The org's whole free allowance is 500 MB.
        #
        # One day is still chosen against USE and not only against the number:
        # symbols are read while diagnosing the build that just broke, and a
        # same-day window covers that. Anything older is re-buildable from the
        # commit, which is the thing actually worth keeping.
        #
        # The release assets are untouched, deliberately. Those are what someone
        # flashes, and they are a seventh of the size.
        retention-days: 1

    # Branch release only fires on push events (branch merge to pono / direct
    # push to a topic branch). Pull-request triggers skip this step: PR CI is
    # for build verification, not release publishing. The release-finalize API
    # call rejects updates when the tag already exists, so PR-time runs of
    # this step were racing the release creation and aborting all 3 builds.
    # Banked as a workflow flake 2026-05-22.
    - name: branch release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ matrix.asset }}.tar.gz
          ${{ matrix.asset }}-debug.tar.gz
        fail_on_unmatched_files: true
